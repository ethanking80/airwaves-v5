<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIRWAVES — Reset Password</title>
<link rel="icon" type="image/jpeg" href="/images/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a12;--surface:#12121e;--surface2:#1a1a2e;--surface3:#22223a;--green:#39ff14;--green-dim:#2bcc10;--blue:#06b6d4;--text:#e8e8f0;--text-dim:#9898a8;--text-muted:#58586a;--danger:#ef4444;--success:#22c55e;--radius:12px;--radius-sm:8px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
input{font-family:inherit;background:var(--surface2);color:var(--text);border:1px solid var(--surface3);border-radius:var(--radius-sm);padding:12px 16px;width:100%;outline:none;transition:border-color .2s}
input:focus{border-color:var(--green)}
button{cursor:pointer;font-family:inherit;border:none;outline:none}
.box{background:var(--surface);border:1px solid var(--surface3);border-radius:var(--radius);padding:40px;max-width:420px;width:100%;text-align:center}
.box img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--green);margin-bottom:16px}
.box h1{font-family:'Archivo Black',sans-serif;font-size:1.3rem;margin-bottom:4px;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.box .sub{color:var(--text-dim);font-size:.88rem;margin-bottom:28px}
.field{margin-bottom:16px;text-align:left}
.field label{display:block;font-size:.78rem;font-weight:600;margin-bottom:6px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em}
.btn{width:100%;padding:12px;border-radius:var(--radius-sm);font-weight:700;font-size:.9rem;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--green);color:#000}
.btn-primary:hover{background:var(--green-dim)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.error{color:var(--danger);font-size:.85rem;margin-top:12px;padding:10px;background:rgba(239,68,68,.1);border-radius:var(--radius-sm);display:none}
.success{color:var(--success);font-size:.85rem;margin-top:12px;padding:10px;background:rgba(34,197,94,.1);border-radius:var(--radius-sm);display:none}
.link{margin-top:20px;font-size:.88rem}
.link a{color:var(--green);text-decoration:none}
.link a:hover{text-decoration:underline}
.pw-strength{margin-top:6px}
.pw-strength .bar{height:4px;border-radius:2px;background:var(--surface3);overflow:hidden}
.pw-strength .fill{height:100%;width:0%;transition:all .3s;border-radius:2px}
.pw-strength .label{font-size:.72rem;margin-top:2px}
.state-icon{font-size:3rem;margin-bottom:16px}
</style>
</head>
<body>
<div class="box">
  <img src="/images/logo.jpg" alt="AIRWAVES">
  <h1>Reset Password</h1>
  <p class="sub" id="subtitle">Enter your new password below</p>
  <div id="loadingState" style="padding:20px;color:var(--text-muted)">Verifying reset link...</div>
  <div id="resetForm" style="display:none">
    <div class="field">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="Min 6 characters" oninput="checkStrength(this.value)">
      <div class="pw-strength" id="pwStrength" style="display:none">
        <div class="bar"><div class="fill" id="pwFill"></div></div>
        <div class="label" id="pwLabel"></div>
      </div>
    </div>
    <div class="field">
      <label>Confirm New Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter password" onkeydown="if(event.key==='Enter')doReset()">
    </div>
    <button class="btn btn-primary" id="resetBtn" onclick="doReset()">Reset Password</button>
    <div class="error" id="error"></div>
  </div>
  <div id="successState" style="display:none">
    <div class="state-icon">&#10003;</div>
    <div class="success" style="display:block">Your password has been reset successfully.</div>
    <div class="link" style="margin-top:20px"><a href="/">Sign in to your account &rarr;</a></div>
  </div>
  <div id="expiredState" style="display:none">
    <div class="state-icon">&#9888;</div>
    <p id="expiredMsg" style="color:var(--text-dim);margin-bottom:16px">This reset link is invalid or has expired.</p>
    <div class="link"><a href="/">Return to AIRWAVES &rarr;</a></div>
  </div>
  <div class="link" id="backLink"><a href="/">&larr; Back to AIRWAVES</a></div>
</div>
<script>
const token = new URLSearchParams(window.location.search).get('token');
function checkStrength(val) {
  const el = document.getElementById('pwStrength'), fill = document.getElementById('pwFill'), label = document.getElementById('pwLabel');
  if (!val) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  let s = 0;
  if (val.length >= 6) s++; if (val.length >= 10) s++; if (/[A-Z]/.test(val)) s++; if (/[0-9]/.test(val)) s++; if (/[^A-Za-z0-9]/.test(val)) s++;
  const l = [{w:'20%',c:'#ef4444',t:'Very weak'},{w:'40%',c:'#ef4444',t:'Weak'},{w:'60%',c:'#f59e0b',t:'Fair'},{w:'80%',c:'#06b6d4',t:'Strong'},{w:'100%',c:'#22c55e',t:'Very strong'}][Math.min(s,4)];
  fill.style.width = l.w; fill.style.background = l.c; label.style.color = l.c; label.textContent = l.t;
}
async function init() {
  if (!token) { showExpired('No reset token found.'); return; }
  try {
    const r = await fetch('/api/auth?action=reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, new_password: '' }) });
    const d = await r.json();
    if (d.error && d.error.includes('6 characters')) showForm();
    else if (d.error && (d.error.includes('expired') || d.error.includes('Invalid'))) showExpired(d.error);
    else showForm();
  } catch { showForm(); }
}
function showForm() { document.getElementById('loadingState').style.display = 'none'; document.getElementById('resetForm').style.display = 'block'; document.getElementById('newPassword').focus(); }
function showExpired(msg) { document.getElementById('loadingState').style.display = 'none'; document.getElementById('subtitle').textContent = ''; document.getElementById('expiredState').style.display = 'block'; document.getElementById('expiredMsg').textContent = msg; document.getElementById('backLink').style.display = 'none'; }
async function doReset() {
  const pw = document.getElementById('newPassword').value, confirm = document.getElementById('confirmPassword').value, errEl = document.getElementById('error'), btn = document.getElementById('resetBtn');
  errEl.style.display = 'none';
  if (!pw || pw.length < 6) { errEl.textContent = 'Password must be at least 6 characters'; errEl.style.display = 'block'; return; }
  if (pw !== confirm) { errEl.textContent = 'Passwords do not match'; errEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Resetting...';
  try {
    const r = await fetch('/api/auth?action=reset-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, new_password: pw }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    document.getElementById('resetForm').style.display = 'none'; document.getElementById('subtitle').textContent = '';
    document.getElementById('successState').style.display = 'block'; document.getElementById('backLink').style.display = 'none';
  } catch (e) { errEl.textContent = e.message; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = 'Reset Password'; }
}
init();
</script>
</body>
</html>

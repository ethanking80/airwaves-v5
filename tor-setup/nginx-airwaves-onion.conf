server {
    listen 127.0.0.1:8080;
    server_name localhost;

    # Serve static frontend
    root /home/jefe/WORK/airwaves/public;
    index index.html;

    # Proxy API calls to Netlify backend
    location /api/ {
        proxy_pass https://airwaves-4.netlify.app/.netlify/functions/;
        proxy_set_header Host airwaves-4.netlify.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    # Proxy .netlify/functions calls too (some JS may use this path)
    location /.netlify/functions/ {
        proxy_pass https://airwaves-4.netlify.app/.netlify/functions/;
        proxy_set_header Host airwaves-4.netlify.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    # SPA fallback — serve index.html for unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers for .onion
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;

    # Disable server tokens
    server_tokens off;

    # Logging (optional — comment out for privacy)
    access_log /var/log/nginx/airwaves-onion-access.log;
    error_log /var/log/nginx/airwaves-onion-error.log;
}
